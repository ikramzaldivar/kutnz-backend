{% extends "base.html" %}
{% block title %}Enlace protegido · kut.nz{% endblock %}
{% block content %}
<main class="status-page">
  <div class="status-card">
    <p class="status-code" aria-hidden="true">🔒</p>
    <h1>Este enlace está protegido</h1>
    <p>Escribe la contraseña que te compartió su dueño para continuar.</p>
    <form class="card" method="post" action="/{{ code }}" autocomplete="off">
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required autofocus maxlength="128">
      </div>
      {% if error %}<p class="error-msg" role="alert">{{ error }}</p>{% endif %}
      <p style="margin:16px 0 0"><button class="btn btn-dark" type="submit">Continuar</button></p>
    </form>
  </div>
</main>
{% endblock %}
